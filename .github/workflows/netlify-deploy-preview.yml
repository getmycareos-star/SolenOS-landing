name: Netlify preview verification (publishing disabled)

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
      - "scripts/verify-qwen-routing.mts"
      - ".github/workflows/netlify-deploy-preview.yml"

permissions:
  contents: read

concurrency:
  group: solenos-netlify-preview-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify build and caregiver safety checks before preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Run product and safety regression checks
        run: npm test
      - name: Build Next.js application
        run: npm run build

# Preview publishing is intentionally disabled during the caregiver interface rebuild.
# This workflow now performs verification only; no Netlify deployment is run.
