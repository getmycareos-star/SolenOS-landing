name: Frontend build verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "repair/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use current npm lockfile resolver
        run: npm install --global npm@11
      - name: Regenerate corrupted or incomplete npm lockfile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Install exact generated dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Type-check and build production assets
        run: npm run build
      - name: Commit regenerated lockfile on repair branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/repair/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Generated lockfile matches the branch; no commit needed."
          else
            git commit -m "Repair npm lockfile from package manifest"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload generated lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconciled-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
