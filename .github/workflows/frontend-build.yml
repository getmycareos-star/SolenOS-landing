name: Frontend build verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "repair/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair manifest/lockfile drift in the ephemeral runner
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build production assets
        run: npm run build
      - name: Run frontend tests
        run: npm test -- --runInBand
