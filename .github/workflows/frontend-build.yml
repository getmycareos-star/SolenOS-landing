name: Frontend build

on:
  push:
    branches:
      - repair/api-contract-netlify-2026-10
concurrency:
  group: frontend-repair-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/api-contract-netlify-2026-10
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Regenerate lockfile from package.json
        run: rm -f package-lock.json && npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund --fetch-timeout=60000 --fetch-retries=1
      - name: Print npm diagnostics on failure
        if: failure()
        run: |
          log_file="$(ls -t "$HOME"/.npm/_logs/*debug-0.log 2>/dev/null | head -n 1)"
          if [ -n "$log_file" ]; then tail -n 180 "$log_file"; else echo "No npm debug log found"; fi
      - name: Install dependencies from regenerated lockfile
        run: npm ci --legacy-peer-deps
      - name: Type-check frontend TypeScript
        run: npm run typecheck
      - name: Create Vite production bundle
        run: npm run build
      - name: Commit reconciled lockfile when changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Reconcile frontend lockfile with package manifest"
            git push origin HEAD:repair/api-contract-netlify-2026-10
          else
            echo "package-lock.json already matches package.json"
          fi
