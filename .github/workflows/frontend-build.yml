name: Frontend build verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Reconcile lockfile with package manifest
        run: rm -f package-lock.json && npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Install exact reconciled dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Type-check and build production assets
        run: npm run build
      - name: Upload generated lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconciled-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
