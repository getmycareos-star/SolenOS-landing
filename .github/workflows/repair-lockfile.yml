name: Repair frontend lockfile (repair branch only)

on:
  push:
    branches: [fix/runtime-api-contract-netlify]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-api-contract-netlify
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update npm to current stable
        run: npm install --global npm@11
      - name: Regenerate the incomplete lockfile from package.json
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit the regenerated lockfile if it changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate complete frontend dependency lockfile"
          git push origin HEAD:fix/runtime-api-contract-netlify
