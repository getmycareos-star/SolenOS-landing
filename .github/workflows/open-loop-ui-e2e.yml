name: Open Loop UI end-to-end

on:
  push:
    branches: [main]
    paths:
      - "src/app/workspace/open-loops/**"
      - "src/components/EvidenceReviewPanel.tsx"
      - "src/components/ConflictResolutionPanel.tsx"
      - "src/components/mvp-workspace/LCRCurrentUnderstanding.tsx"
      - "src/api/client.ts"
      - "e2e/open-loop-workflow.mjs"
      - ".github/workflows/open-loop-ui-e2e.yml"
  pull_request:
    paths:
      - "src/app/workspace/open-loops/**"
      - "src/api/client.ts"
      - "e2e/open-loop-workflow.mjs"
      - ".github/workflows/open-loop-ui-e2e.yml"

permissions:
  contents: read

jobs:
  open-loop-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solenos_open_loop_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d solenos_open_loop_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out frontend
        uses: actions/checkout@v4

      - name: Check out backend main for real API integration
        uses: actions/checkout@v4
        with:
          repository: getmycareos-star/SolenOS_backend
          ref: main
          path: backend-service

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend and browser test dependency
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Install backend
        working-directory: backend-service/backend
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Migrate isolated PostgreSQL database
        working-directory: backend-service/backend
        env:
          APP_ENV: test
          SECRET_KEY: ci-only-secret-key-long-enough-for-test-runtime
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/solenos_open_loop_e2e
        run: python -m alembic upgrade head

      - name: Start real backend with isolated PostgreSQL test database
        working-directory: backend-service/backend
        env:
          APP_ENV: test
          SECRET_KEY: ci-only-secret-key-long-enough-for-test-runtime
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/solenos_open_loop_e2e
          CORS_ORIGINS: http://127.0.0.1:3000
        run: |
          nohup env APP_ENV=test SECRET_KEY=ci-only-secret-key-long-enough-for-test-runtime DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/solenos_open_loop_e2e CORS_ORIGINS=http://127.0.0.1:3000 uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/solenos-open-loop-backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/solenos-open-loop-backend.log
          exit 1

      - name: Build and start Next.js
        run: |
          npm run build
          nohup npm run start -- --hostname 127.0.0.1 >/tmp/solenos-open-loop-frontend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/workspace/open-loops >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/solenos-open-loop-frontend.log
          exit 1

      - name: Run real-browser Open Loop handoff and reconciliation workflow
        env:
          FRONTEND_URL: http://127.0.0.1:3000
          BACKEND_URL: http://127.0.0.1:8000
        run: node e2e/open-loop-workflow.mjs

      - name: Print backend logs on failure
        if: failure()
        run: cat /tmp/solenos-open-loop-backend.log || true
