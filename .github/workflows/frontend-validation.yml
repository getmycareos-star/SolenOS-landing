name: Frontend build and regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "repair/**"]

jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and production build
        run: npm run build
      - name: Run frontend tests
        run: npm test -- --runInBand
