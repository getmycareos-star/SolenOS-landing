name: Frontend build and regression

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, "repair/**"]

permissions:
  contents: read

jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use current npm lockfile resolver
        run: npm install --global npm@11
      - name: Regenerate lockfile in CI workspace
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Install dependencies without running unapproved scripts
        run: npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Approve required dependency install scripts
        run: |
          npm install-scripts approve @parcel/watcher
          npm install-scripts approve @sentry/cli
          npm install-scripts approve esbuild
          npm install-scripts approve unrs-resolver
      - name: Run approved dependency install scripts
        run: npm rebuild --legacy-peer-deps
      - name: Type-check and production build
        run: npm run build
      - name: Run frontend tests
        run: npm test -- --runInBand
