name: Frontend validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --legacy-peer-deps --package-lock=false --registry=https://registry.npmjs.org
      - name: Type-check and production build
        run: npm run build
      - name: Run Jest tests
        run: npm test -- --runInBand --passWithNoTests
