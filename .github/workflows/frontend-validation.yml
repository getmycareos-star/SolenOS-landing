name: Frontend validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and production build
        run: npm run typecheck && npm run build
      - name: Verify document intake, review and incomplete-page safeguards
        run: npm run verify:document-scan-processing && npm run verify:document-review-history && npm run verify:companion-home
      - name: Run continuity and production-safety checks
        run: npm test
      - name: Verify caregiver-facing language boundary
        run: npm run verify:caregiver-language-boundary
