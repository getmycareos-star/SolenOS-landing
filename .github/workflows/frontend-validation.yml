name: Frontend build and regression

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, "repair/**"]

permissions:
  contents: read

jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use current npm lockfile resolver
        run: npm install --global npm@11
      - name: Regenerate lockfile in CI workspace
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Type-check and production build
        run: npm run build
      - name: Run frontend tests
        run: npm test -- --runInBand
