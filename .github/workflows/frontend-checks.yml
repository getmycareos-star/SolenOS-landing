name: Frontend checks

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "netlify.toml"
      - "tsconfig*.json"
      - ".github/workflows/frontend-checks.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/frontend-checks.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build production bundle
        run: npm run build

      - name: Verify Netlify uses the Vite bundle and current API proxy
        run: |
          python - <<'PY'
          from pathlib import Path

          config = Path("netlify.toml").read_text(encoding="utf-8")
          required = [
              'command = "npm run build"',
              'publish = "dist"',
              'to = "https://solenosbackend-production-ee6a.up.railway.app/api/:splat"',
              'to = "/index.html"',
          ]
          missing = [item for item in required if item not in config]
          if missing:
              raise SystemExit(f"Netlify config is missing required Vite/API settings: {missing}")
          if ".next" in config or "plugin-nextjs" in config:
              raise SystemExit("Netlify config still contains a Next.js build target/plugin.")
          if config.index('from = "/api/*"') > config.index('from = "/*"'):
              raise SystemExit("The SPA fallback must come after the API proxy.")
          print("PASS: Netlify config targets Vite dist, current Railway API, and ordered SPA fallback.")
          PY
