name: Frontend checks

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
      - "tsconfig*.json"
      - "scripts/verify-care-situation-understanding.mts"
      - "scripts/verify-lcr-caregiver-first-redesign.mts"
      - "e2e/open-loop-workflow.mjs"
      - ".github/workflows/frontend-checks.yml"
      - ".github/workflows/netlify-production-deploy.yml"
  pull_request:
    paths:
      - "src/**"
