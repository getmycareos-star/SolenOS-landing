name: Frontend checks

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
      - "tsconfig*.json"
      - ".github/workflows/frontend-checks.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
      - "tsconfig*.json"
      - ".github/workflows/frontend-checks.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check Next.js application
        run: npm run typecheck

      - name: Run continuity and production-safety checks
        run: npm test

      - name: Build production Next.js application
        run: npm run build

      - name: Verify Netlify targets Next.js
        run: |
          python - <<'PY'
          from pathlib import Path
          config = Path("netlify.toml").read_text(encoding="utf-8")
          package = Path("package.json").read_text(encoding="utf-8")
          required = ['publish = ".next"', 'package = "@netlify/plugin-nextjs"', 'to = "https://solenosbackend-production.up.railway.app/api/:splat"']
          missing = [item for item in required if item not in config]
          if missing:
              raise SystemExit(f"Next.js Netlify configuration missing: {missing}")
          if '"build": "next build"' not in package or '"dev": "next dev"' not in package:
              raise SystemExit("package.json is not configured for Next.js.")
          if Path("vite.config.ts").exists() or Path("src/main.tsx").exists():
              raise SystemExit("Vite entry/config files remain in the active repository root.")
          print("PASS: Next.js build, Netlify plugin and Railway API proxy are configured.")
          PY
