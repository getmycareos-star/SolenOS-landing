name: Reconcile frontend lockfile (repair branch only)

on:
  push:
    branches:
      - repair/netlify-vite-api-base

permissions:
  contents: write

jobs:
  reconcile-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/netlify-vite-api-base
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate lockfile from the current manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile only if it changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: reconcile frontend package lock"
          git push origin HEAD:repair/netlify-vite-api-base
