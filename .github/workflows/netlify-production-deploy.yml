name: Netlify production deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
      - ".github/workflows/netlify-production-deploy.yml"
      - ".github/workflows/frontend-checks.yml"
      - ".github/workflows/anonymous-account-continuity-e2e.yml"
      - ".github/workflows/open-loop-ui-e2e.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
      - ".github/workflows/netlify-production-deploy.yml"
      - ".github/workflows/frontend-checks.yml"
      - ".github/workflows/anonymous-account-continuity-e2e.yml"
      - ".github/workflows/open-loop-ui-e2e.yml"

permissions:
  contents: read

concurrency:
  group: solenos-netlify-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify production build before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Verify production backend supports saved care history
        env:
          BACKEND_OPENAPI_URL: https://solenosbackend-production.up.railway.app/openapi.json
        shell: bash
        run: |
          curl --fail --silent --show-error "$BACKEND_OPENAPI_URL" -o /tmp/solenos-openapi.json
          node - <<'NODE'
          const fs = require("node:fs");
          const spec = JSON.parse(fs.readFileSync("/tmp/solenos-openapi.json", "utf8"));
          const requiredPath = "/api/v1/care-continuity/record-snapshots/as-of";
          if (!Object.hasOwn(spec.paths ?? {}, requiredPath)) {
            console.error("Production backend does not yet provide saved care history. Frontend production deployment is blocked.");
            process.exit(1);
          }
          console.log("Production backend has the saved care history endpoint.");
          NODE
      - name: Type-check
        run: npm run typecheck
      - name: Run product and safety regression checks
        run: npm test
      - name: Build Next.js production app
        run: npm run build

  deploy:
    name: Deploy production to Netlify
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && !contains(github.event.head_commit.message, '[verify-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: dfbe1cd8-6450-4ed7-b9d8-e3bb39a0acbe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Fail clearly if Netlify credentials are not configured
        shell: bash
        run: |
          if [[ -z "${NETLIFY_AUTH_TOKEN}" ]]; then
            echo "::error::Missing GitHub Actions secret NETLIFY_AUTH_TOKEN. Configure the Netlify personal access token before production deployment."
            exit 1
          fi
      - name: Build with Netlify's configured Next.js plugin and publish production
        run: npx --yes netlify-cli@latest deploy --prod --build --site "$NETLIFY_SITE_ID"
