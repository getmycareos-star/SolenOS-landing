name: Netlify production deployment

on:
  workflow_dispatch:
    inputs:
      release_approved:
        description: "Explicitly approve production deployment after all release acceptance gates pass"
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
      - ".github/workflows/netlify-production-deploy.yml"
      - ".github/workflows/frontend-checks.yml"
      - ".github/workflows/anonymous-account-continuity-e2e.yml"
      - ".github/workflows/open-loop-ui-e2e.yml"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  # Isolate pull-request verification so unrelated previews cannot cancel one
  # another. Production release runs share a protected group and are never
  # cancelled by a newer preview or workflow dispatch.
  group: ${{ github.event_name == 'pull_request' && format('solenos-netlify-pr-{0}', github.event.pull_request.number) || 'solenos-netlify-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify production build before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Verify production backend supports saved care history
        env:
          BACKEND_OPENAPI_URL: https://solenosbackend-production.up.railway.app/openapi.json
        shell: bash
        run: |
          curl --fail --silent --show-error "$BACKEND_OPENAPI_URL" -o /tmp/solenos-openapi.json
          node - <<'NODE'
          const fs = require("node:fs");
          const spec = JSON.parse(fs.readFileSync("/tmp/solenos-openapi.json", "utf8"));
          const requiredPath = "/api/v1/care-continuity/record-snapshots/as-of";
          if (!Object.hasOwn(spec.paths ?? {}, requiredPath)) {
            console.error("Production backend does not yet provide saved care history. Frontend production deployment is blocked.");
            process.exit(1);
          }
          console.log("Production backend has the saved care history endpoint.");
          NODE
      - name: Type-check
        run: npm run typecheck
      - name: Run product and safety regression checks
        run: npm test
      - name: Build Next.js production app
        run: npm run build

      - name: Require successful backend release checks for unchanged backend source
        if: github.event_name == 'workflow_dispatch' && inputs.release_approved == true
        shell: bash
        run: |
          set -euo pipefail
          backend_sha="$(curl -fsSL https://api.github.com/repos/getmycareos-star/SolenOS_backend/branches/main | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).commit.sha))')"
          runs="$(curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/getmycareos-star/SolenOS_backend/actions/runs?branch=main&per_page=100")"
          git init --quiet /tmp/solenos-backend-source
          git -C /tmp/solenos-backend-source remote add origin https://github.com/getmycareos-star/SolenOS_backend.git
          git -C /tmp/solenos-backend-source fetch --quiet --depth=200 origin main
          BACKEND_SHA="$backend_sha" RUNS_JSON="$runs" node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const runs = JSON.parse(process.env.RUNS_JSON).workflow_runs || [];
          const backendSha = process.env.BACKEND_SHA;
          const checks = [
            {
              name: "Backend tests",
              paths: ["backend/", "ci/", "Dockerfile", "start-with-qwen.sh", "railway.json", ".dockerignore"],
            },
            {
              name: "PostgreSQL migration validation",
              paths: ["backend/alembic/", "backend/app/", "backend/tests/", "backend/scripts/", "backend/pyproject.toml", "backend/alembic.ini"],
            },
            {
              name: "Backup and recovery verification",
              paths: ["backend/app/", "backend/alembic/", "backend/scripts/", "backend/tests/", "backend/pyproject.toml", "backend/alembic.ini"],
            },
            {
              name: "Backend validation",
              paths: ["backend/", "ci/", "Dockerfile", "railway.json"],
            },
            {
              name: "Document lifecycle PostgreSQL integration",
              paths: ["backend/"],
            },
            {
              name: "Production readiness monitor",
              paths: ["backend/app/", "backend/alembic/", "Dockerfile", "railway.json"],
            },
          ];
          const failures = [];
          for (const required of checks) {
            const latest = runs
              .filter((run) => run.name === required.name && run.head_branch === "main")
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
            if (!latest) {
              failures.push(`${required.name}: no main-branch run found`);
              continue;
            }
            if (latest.status !== "completed" || latest.conclusion !== "success") {
              failures.push(`${required.name}: ${latest.status}/${latest.conclusion || "pending"} (${latest.head_sha})`);
              continue;
            }
            try {
              execFileSync("git", ["-C", "/tmp/solenos-backend-source", "cat-file", "-e", `${latest.head_sha}^{commit}`], { stdio: "ignore" });
              execFileSync("git", ["-C", "/tmp/solenos-backend-source", "merge-base", "--is-ancestor", latest.head_sha, backendSha], { stdio: "ignore" });
              execFileSync("git", ["-C", "/tmp/solenos-backend-source", "diff", "--quiet", `${latest.head_sha}..${backendSha}`, "--", ...required.paths], { stdio: "ignore" });
            } catch {
              failures.push(`${required.name}: backend source changed after tested commit ${latest.head_sha}`);
            }
          }
          if (failures.length) {
            process.stderr.write(`Backend release checks are not current for main (${backendSha}):\\n${failures.join("\\n")}\\n`);
            process.exit(1);
          }
          process.stdout.write(`All required backend checks passed, and backend source paths are unchanged through ${backendSha}.\\n`);
          NODE

  caregiver-acceptance:
    name: Verify all caregiver journeys against PostgreSQL and a real browser
    if: github.event_name == 'workflow_dispatch' && inputs.release_approved == true
    uses: ./.github/workflows/critical-care-journeys-e2e.yml

  deploy:
    name: Deploy production to Netlify
    needs: [verify, caregiver-acceptance]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.release_approved == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: dfbe1cd8-6450-4ed7-b9d8-e3bb39a0acbe
      SOLENOS_RELEASE_APPROVED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Fail clearly if Netlify credentials are not configured
        shell: bash
        run: |
          if [[ -z "${NETLIFY_AUTH_TOKEN}" ]]; then
            echo "::error::Missing GitHub Actions secret NETLIFY_AUTH_TOKEN. Configure the Netlify personal access token before production deployment."
            exit 1
          fi
      - name: Build with Netlify's configured Next.js plugin and publish production
        run: npx --yes netlify-cli@latest deploy --prod --build --site "$NETLIFY_SITE_ID"
