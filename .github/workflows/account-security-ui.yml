name: Account security UI validation

on:
  pull_request:
    paths:
      - "src/app/account/**"
      - "src/app/verify-email/**"
      - "src/app/reset-password/**"
      - "src/app/recover-account/**"
      - "src/components/account/**"
      - "src/app/workspace/settings/page.tsx"
      - ".github/workflows/account-security-ui.yml"

permissions:
  contents: read

jobs:
  next-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
