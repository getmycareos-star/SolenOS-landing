name: Phase 1 frontend build

on:
  push:
    branches:
      - repair/phase1-build-deployment
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase1-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install clean dependency tree
        run: npm ci --legacy-peer-deps
      - name: Type-check active Vite application graph
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test -- --runInBand
      - name: Build production assets
        run: npm run build
