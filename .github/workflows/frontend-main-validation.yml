name: Frontend main validation

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.*"
      - ".github/workflows/frontend-main-validation.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.*"
      - ".github/workflows/frontend-main-validation.yml"

permissions:
  contents: read

concurrency:
  group: frontend-main-validation-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci
      - name: Verify caregiver-facing language before other checks
        run: npm run verify:caregiver-ui-language-all

      - name: Verify production telemetry cannot fall back to process memory
        run: npm run verify:telemetry-production-fail-closed
      - name: Export frontend API call-site inventory
        run: node scripts/export-api-call-sites.mjs --output frontend-api-call-sites.json
      - name: Publish frontend API call-site inventory
        uses: actions/upload-artifact@v4
        with:
          name: frontend-api-call-sites
          path: frontend-api-call-sites.json
          if-no-files-found: error
          retention-days: 30

      - name: Type-check frontend
        run: npm run typecheck

      - name: Verify decision and outcome continuity
        run: npm run verify:continuity-core-tier1

      - name: Run frontend regression suite
        run: npm test

      - name: Build production frontend
        run: npm run build
