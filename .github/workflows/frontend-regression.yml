name: Frontend regression

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".github/workflows/frontend-regression.yml"
  push:
    branches:
      - security/auth-foundation-client

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run frontend tests
        run: npm test -- --runInBand
      - name: Type-check and build production bundle
        run: npm run build
