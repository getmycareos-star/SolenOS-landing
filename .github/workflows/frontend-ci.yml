name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and build Vite application
        run: npm run build
      - name: Run Jest unit tests
        run: npm test -- --runInBand
