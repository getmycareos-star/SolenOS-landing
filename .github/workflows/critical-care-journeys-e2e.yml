name: Critical care journeys — real backend and browser (main validation)

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - "e2e/web-push-delivery.mjs"
      - "src/lib/offline-sync/**"
      - ".github/workflows/critical-care-journeys-e2e.yml"
  push:
    branches: [main]
    paths:
      - "e2e/critical-care-journeys.mjs"
      - "e2e/document-continuity-stubbed-inference.mjs"
      - "e2e/document-test-backend.py"
      - "e2e/anonymous-account-continuity.mjs"
      - "e2e/web-push-delivery.mjs"
      - "e2e/dark-mode-audit.mjs"
      - "package.json"
      - "package-lock.json"
      - "public/sw.js"
      - "src/api/client.ts"
      - "src/lib/api-url.ts"
      - "src/lib/share-summary.ts"
      - "src/lib/domains/notification/**"
      - "src/components/NotificationBell.tsx"
      - "src/app/workspace/notifications/**"
      - "src/app/api/**"
      - "src/lib/situation-entry/**"
      - "src/lib/offline-sync/**"
      - "src/app/workspace/**"
      - "src/app/globals.css"
      - "src/app/dark-mode-remediation.css"
      - "src/app/accessibility-overrides.css"
      - "src/app/layout.tsx"
      - "src/components/app-shell/**"
      - "scripts/verify-handoff-source-provenance.mts"
      - "src/components/workflows/**"
      - "src/components/mvp-workspace/**"
      - "src/components/DocumentIntelligenceReview.tsx"
      - "src/components/ClarificationWorkflowPanel.tsx"
      - ".github/workflows/critical-care-journeys-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep each commit's real-backend acceptance run queued independently. A later
  # main push must not replace a pending release-validation run before it starts.
  group: critical-care-journeys-${{ github.ref }}-${{ github.sha }}-no-model
  cancel-in-progress: false

jobs:
  critical-care-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: solenos_ci
          POSTGRES_PASSWORD: solenos_ci
          POSTGRES_DB: solenos_critical_journeys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solenos_ci -d solenos_critical_journeys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key-long-enough-for-test-runtime
      DATABASE_URL: postgresql+psycopg2://solenos_ci:solenos_ci@localhost:5432/solenos_critical_journeys
      SOLENOS_REQUIRE_LIVE_QWEN: "0"
      SOLENOS_TEST_DISABLE_QWEN: "1"
    steps:
      - name: Check out triggering frontend commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Record frontend revision under test
        run: |
          git rev-parse HEAD
          git log -1 --oneline

      - name: Check out backend main
        uses: actions/checkout@v4
        with:
          repository: getmycareos-star/SolenOS_backend
          ref: main
          path: backend-service
      - name: Record exact backend main revision including py_vapid encoding fix
        run: |
          git -C backend-service rev-parse HEAD
          git -C backend-service log -1 --oneline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-service/backend/pyproject.toml

      - name: Install browser and backend dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
          npx playwright install chrome
          python -m pip install --upgrade pip
          python -m pip install -e ./backend-service/backend

      - name: Configure ephemeral independent privacy reviewers for deletion acceptance
        run: |
          python - <<'PY'
          import os
          import secrets
          primary = secrets.token_urlsafe(48)
          deletion = secrets.token_urlsafe(48)
          values = {
              "SOLENOS_PRIVACY_REVIEWER_TOKEN": primary,
              "SOLENOS_PRIVACY_REVIEWER_ID": "ci-primary-privacy-reviewer",
              "SOLENOS_PRIVACY_DELETION_REVIEWER_TOKEN": deletion,
              "SOLENOS_PRIVACY_DELETION_REVIEWER_ID": "ci-independent-deletion-reviewer",
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in values.items():
                  env.write(f"{key}={value}\n")
          print("::add-mask::" + primary)
          print("::add-mask::" + deletion)
          PY

      - name: Apply all PostgreSQL migrations
        working-directory: backend-service/backend
        run: python -m alembic upgrade head

      - name: Start FastAPI on the isolated PostgreSQL database
        working-directory: backend-service/backend
        run: |
          nohup env APP_ENV=test SOLENOS_TEST_DISABLE_QWEN="$SOLENOS_TEST_DISABLE_QWEN" SECRET_KEY="$SECRET_KEY" DATABASE_URL="$DATABASE_URL" SOLENOS_PRIVACY_REVIEWER_TOKEN="$SOLENOS_PRIVACY_REVIEWER_TOKEN" SOLENOS_PRIVACY_REVIEWER_ID="$SOLENOS_PRIVACY_REVIEWER_ID" SOLENOS_PRIVACY_DELETION_REVIEWER_TOKEN="$SOLENOS_PRIVACY_DELETION_REVIEWER_TOKEN" SOLENOS_PRIVACY_DELETION_REVIEWER_ID="$SOLENOS_PRIVACY_DELETION_REVIEWER_ID" CORS_ORIGINS=http://127.0.0.1:3000 BACKEND_SERVICE_DIR="$GITHUB_WORKSPACE/backend-service/backend" python "$GITHUB_WORKSPACE/e2e/document-test-backend.py" >/tmp/solenos-critical-backend.log 2>&1 &
          echo $! >/tmp/solenos-critical-backend.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/solenos-critical-backend.log
          exit 1

      - name: Build and start the actual Next.js frontend
        run: |
          npm run build
          nohup npm run start -- --hostname 127.0.0.1 >/tmp/solenos-critical-frontend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/workspace >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/solenos-critical-frontend.log
          exit 1

      - name: Execute real-backend caregiver and situation journeys in Chromium
        env:
          FRONTEND_URL: http://127.0.0.1:3000
          BACKEND_URL: http://127.0.0.1:8000
          SOLENOS_REQUIRE_LIVE_QWEN: "0"
        run: node e2e/critical-care-journeys.mjs

      - name: Verify anonymous account claiming and fresh-browser recovery against PostgreSQL
        env:
          FRONTEND_URL: http://127.0.0.1:3000
          BACKEND_URL: http://127.0.0.1:8000
        run: node e2e/anonymous-account-continuity.mjs

      - name: Verify document upload, deterministic extraction, caregiver review and LCR persistence
        env:
          FRONTEND_URL: http://127.0.0.1:3000
          BACKEND_URL: http://127.0.0.1:8000
          SOLENOS_REQUIRE_LIVE_QWEN: "0"
        run: node e2e/document-continuity-stubbed-inference.mjs

      - name: Verify in-app notification delivery, disabled browser push and restart persistence
        env:
          FRONTEND_URL: http://127.0.0.1:3000
          BACKEND_URL: http://127.0.0.1:8000
          BACKEND_SERVICE_DIR: ${{ github.workspace }}/backend-service/backend
        run: node e2e/web-push-delivery.mjs

      - name: Audit rendered dark mode on the isolated browser build
        if: always()
        env:
          BACKEND_URL: http://127.0.0.1:8000
          FRONTEND_URL: http://127.0.0.1:3000
        run: node e2e/dark-mode-audit.mjs

      - name: Upload rendered dark-mode screenshots and contrast report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dark-mode-rendered-audit
          path: artifacts/dark-mode/
          if-no-files-found: warn

      - name: Print service logs on failure
        if: failure()
        run: |
          cat /tmp/solenos-critical-backend.log || true
          cat /tmp/solenos-critical-frontend.log || true
