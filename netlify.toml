# SolenOS-landing — Netlify configuration for the Vite + React application.
# Vite writes the production static site to dist/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  port = 5173


# Proxy all /api/* calls to the Railway backend (SolenOS_backend).
# The frontend repo no longer ships Next.js API route handlers.
[[redirects]]
  from = "/api/*"
  to = "https://solenosbackend-production-8773.up.railway.app/api/:splat"
  status = 200
  force = true

# React Router client-side routes must resolve to the Vite SPA entry point.
# Keep this after the API proxy so /api/* never falls through to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

