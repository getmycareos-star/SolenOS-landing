# SolenOS-landing uses Vite + React; production assets are emitted to dist/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[dev]
  command = "npm run dev"
  port = 5173

# Proxy API requests before the SPA fallback so API errors are not served as index.html.
[[redirects]]
  from = "/api/*"
  to = "https://solenosbackend-production-8773.up.railway.app/api/:splat"
  status = 200
  force = true

# React Router client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
