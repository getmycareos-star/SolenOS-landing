# SolenOS-landing — Netlify configuration for the Vite + React application.
# Vite writes the production static site to dist/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Cache installed dependencies between deploys.
[[build.cache]]
  path = "node_modules"
  ttl = "7"

[dev]
  command = "npm run dev"
  port = 5173


# Proxy all /api/* calls to the Railway backend (SolenOS_backend).
# The frontend repo no longer ships Next.js API route handlers.
[[redirects]]
  from = "/api/*"
  to = "https://solenosbackend-production-8773.up.railway.app/api/:splat"
  status = 200
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# CORS headers for API proxy to Railway backend
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Max-Age = "86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

