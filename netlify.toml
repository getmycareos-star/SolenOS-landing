# SolenOS-landing — Netlify configuration for Next.js App Router
# Build must run `next build` and Netlify must serve the Next.js server output.
# We do NOT use `publish = ".next"` (raw `.next` has no index.html → blank page).
# The official @netlify/plugin-nextjs runtime builds and serves the app correctly.

[build]
  command = "npm run build"
  # Next.js on Netlify: plugin handles publish dir; do not set publish to ".next"

[build.environment]
  NODE_VERSION = "20"

[dev]
  command = "npm run dev"
  port = 3000

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Proxy all /api/* calls to the Railway backend (SolenOS_backend).
# The frontend repo no longer ships Next.js API route handlers.
[[redirects]]
  from = "/api/*"
  to = "https://solenos-backend.up.railway.app/api/:splat"
  status = 200
  force = false

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

