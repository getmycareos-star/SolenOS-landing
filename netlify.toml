# SolenOS-landing — Netlify configuration for Next.js App Router
# Build must run `next build` and Netlify must serve the Next.js server output.
# The @netlify/plugin-nextjs runtime REQUIRES publish = ".next"
# (the plugin transforms .next output into Netlify-compatible functions + rewrites).
# publish must be distinct from base (repo root) or the plugin errors out.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Build caching — persist the Next.js build cache and node_modules between deploys
[[build.cache]]
  path = ".next/cache"
  ttl = "7"

[[build.cache]]
  path = "node_modules"
  ttl = "7"

[dev]
  command = "npm run dev"
  port = 3000

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Proxy only API routes owned by the FastAPI backend. Keeping the scope
# explicit prevents unrelated frontend-owned or unsupported paths (for example
# telemetry) from being silently forwarded to the backend.
[[redirects]]
  from = "/api/v1/*"
  to = "https://solenosbackend-production.up.railway.app/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/situation"
  to = "https://solenosbackend-production.up.railway.app/api/situation"
  status = 200
  force = true

# Authenticated document extraction is a backend endpoint, not a Next.js API
# route. This rule becomes functional when the matching backend PR is deployed.
[[redirects]]
  from = "/api/extract"
  to = "https://solenosbackend-production.up.railway.app/api/extract"
  status = 200
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# API calls use this site's same-origin /api/* proxy. Browser CORS is not
# required for same-origin requests; the Railway backend owns its explicit
# CORS allowlist for direct cross-origin clients.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

