# SolenOS frontend is a Vite + React SPA (package.json is authoritative).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[dev]
  command = "npm run dev"
  port = 5173

# Preserve client-side React Router navigation.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Keep the /api prefix and forward the exact suffix to the backend.
# Example: /api/v1/situation -> backend /api/v1/situation.
[[redirects]]
  from = "/api/*"
  to = "https://solenosbackend-production-8773.up.railway.app/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
