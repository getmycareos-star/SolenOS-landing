# SolenOS frontend — Netlify configuration for the Vite + React app.
# package.json runs "tsc && vite build", which writes the deployable site to dist/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[dev]
  command = "npm run dev"
  port = 5173

# Keep API calls same-origin in production. This avoids browser CORS issues
# and forwards them to the deployed Railway backend.
[[redirects]]
  from = "/api/*"
  to = "https://solenosbackend-production-8773.up.railway.app/api/:splat"
  status = 200
  force = true

# React Router client-side routes must resolve to the Vite entry point.
# Keep this after the API proxy so /api/* is not swallowed by the SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
